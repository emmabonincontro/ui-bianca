        visibility: hidden;

        opacity: 0;
        pointer-events: none;

    <!-- Vanilla JavaScript: State, Navigation, Gestures, Audio & Layout -->
    <script>
      // State
      let currentPage = 1;
      let soundEnabled = true;
      let showGuides = false;
      let scaleMode = 'fit'; // 'fit' or 'native'
      let audioCtx = null;

      // Audio feedback synthesis via Web Audio API (zero external files)
      function playClickSound(type) {
        if (!soundEnabled) return;
        try {
          if (!audioCtx) {
            const AudioClass = window.AudioContext || window.webkitAudioContext;
            if (AudioClass) audioCtx = new AudioClass();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (!audioCtx) return;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const now = audioCtx.currentTime;

          if (type === 'forward') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.04);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
          } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(640, now);
            osc.frequency.exponentialRampToValueAtTime(260, now + 0.045);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.055);
          }
        } catch (e) {
          // Silent fallback
        }
      }

      // Page Navigation Handler
      function goToPage(targetPage) {
        if (targetPage === currentPage) return;

        const p1 = document.getElementById('pagina-1');
        const p2 = document.getElementById('pagina-2');
        const tab1 = document.getElementById('tab-page-1');
        const tab2 = document.getElementById('tab-page-2');
        const statusLabel = document.getElementById('status-page-label');
        const shortcutKey = document.getElementById('shortcut-key');
        const shortcutText = document.getElementById('shortcut-text');

        if (targetPage === 2) {
          // Slide forward from Page 1 to Page 2
          p1.className = 'page-container page-hidden-left flex flex-col items-center justify-center p-6 bg-white select-none';
          p2.className = 'page-container page-active flex flex-col items-center justify-center p-6 bg-white select-none';
          
          tab1.className = 'px-3 py-1 text-xs font-mono font-bold transition-colors cursor-pointer text-black hover:bg-neutral-200';
          tab2.className = 'px-3 py-1 text-xs font-mono font-bold transition-colors cursor-pointer bg-black text-white';

          statusLabel.textContent = 'Stato: Pagina 2 di 2';
          shortcutKey.textContent = 'Esc / ← / Backspace';
          shortcutText.textContent = 'per andare "indietro"';

          playClickSound('forward');
          currentPage = 2;
        } else {
          // Slide backward from Page 2 to Page 1
          p2.className = 'page-container page-hidden-right flex flex-col items-center justify-center p-6 bg-white select-none';
          p1.className = 'page-container page-active flex flex-col items-center justify-center p-6 bg-white select-none';

          tab2.className = 'px-3 py-1 text-xs font-mono font-bold transition-colors cursor-pointer text-black hover:bg-neutral-200';
          tab1.className = 'px-3 py-1 text-xs font-mono font-bold transition-colors cursor-pointer bg-black text-white';

          statusLabel.textContent = 'Stato: Pagina 1 di 2';
          shortcutKey.textContent = 'Invio / →';
          shortcutText.textContent = 'per andare "avanti"';

          playClickSound('backward');
          currentPage = 1;
        }
      }

      // Toggle Alignment Guides
      function toggleGuides() {
        showGuides = !showGuides;
        const guidesEl = document.getElementById('wireframe-guides');
        const btnGuides = document.getElementById('btn-toggle-guides');
        if (showGuides) {
          guidesEl.classList.remove('hidden');
          btnGuides.classList.remove('bg-white', 'text-black');
          btnGuides.classList.add('bg-black', 'text-white');
        } else {
          guidesEl.classList.add('hidden');
          btnGuides.classList.remove('bg-black', 'text-white');
          btnGuides.classList.add('bg-white', 'text-black');
        }
      }

      // Toggle Sound Effects
      function toggleSound() {
        soundEnabled = !soundEnabled;
        const iconOn = document.getElementById('icon-sound-on');
        const iconOff = document.getElementById('icon-sound-off');
        const btnSound = document.getElementById('btn-toggle-sound');

        if (soundEnabled) {
          iconOn.classList.remove('hidden');
          iconOff.classList.add('hidden');
          btnSound.classList.remove('bg-white', 'text-black');
          btnSound.classList.add('bg-black', 'text-white');
        } else {
          iconOn.classList.add('hidden');
          iconOff.classList.remove('hidden');
          btnSound.classList.remove('bg-black', 'text-white');
          btnSound.classList.add('bg-white', 'text-black');
        }
      }

      // Toggle Scale Mode (Fit vs 100% Native)
      function toggleScale() {
        scaleMode = scaleMode === 'fit' ? 'native' : 'fit';
        const label = document.getElementById('scale-mode-label');
        label.textContent = scaleMode === 'fit' ? '100% Nativo' : 'Adatta';
        updateScale();
      }

      // Auto-compute Scale Factor
      function updateScale() {
        const phoneScaler = document.getElementById('phone-scaler');
        const scaleIndicator = document.getElementById('scale-indicator');

        if (scaleMode === 'native') {
          phoneScaler.style.transform = 'scale(1)';
          if (scaleIndicator) scaleIndicator.textContent = 'SCALE: 100%';
          return;
        }

        const availableHeight = window.innerHeight - 150;
        const availableWidth = window.innerWidth - 32;

        const scaleH = availableHeight / 860;
        const scaleW = availableWidth / 440;

        const fit = Math.min(scaleH, scaleW, 1.0);
        const finalScale = Math.max(0.55, fit);

        phoneScaler.style.transform = `scale(${finalScale})`;
        if (scaleIndicator) {
          scaleIndicator.textContent = `SCALE: ${Math.round(finalScale * 100)}%`;
        }
      }

      // Keyboard navigation
      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(e.target?.tagName)) return;

        if (currentPage === 1) {
          if (e.key === 'ArrowRight' || e.key === 'Enter') {
            e.preventDefault();
            goToPage(2);
          }
        } else if (currentPage === 2) {
          if (e.key === 'ArrowLeft' || e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goToPage(1);
          }
        }
      });

      // Window resize listener
      window.addEventListener('resize', updateScale);

      // Initial scale calculation on load
      window.addEventListener('DOMContentLoaded', updateScale);
      updateScale();
    </script>
  </body>
</html>
